stages:
  - publish

publish-docker-images:
  stage: publish
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
    DOCKERHUB_USERNAME: "rabbitglauser"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - IMAGE_TAG="$CI_COMMIT_SHORT_SHA" PUSH_LATEST="true" sh build-and-push.sh
