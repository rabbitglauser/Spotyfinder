services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ../.env.dev
    ports:
      - "5432:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../database/script/ddl.sql:/docker-entrypoint-initdb.d/includes/ddl.inc:ro
      - ../database/script/seed.sql:/docker-entrypoint-initdb.d/includes/seed.inc:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile.dev
    restart: unless-stopped
    init: true
    env_file:
      - ../.env.dev
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ../backend
        target: /app
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.dev
    restart: unless-stopped
    init: true
    env_file:
      - ../.env.dev
    ports:
      - "3000:3000"
    volumes:
      - type: bind
        source: ../frontend
        target: /app
      - frontend_node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -lc "pnpm config set store-dir /pnpm/store &&
              pnpm config set network-timeout 600000 &&
              [ -f node_modules/next/dist/bin/next ] || pnpm install --frozen-lockfile --prefer-offline --reporter=append-only &&
              pnpm exec next dev --webpack --hostname 0.0.0.0 --port 3000"

volumes:
  mysql_data:
  frontend_node_modules:
  pnpm_store:
