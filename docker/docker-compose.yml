services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spotyfinder
      POSTGRES_USER: spotyfinder
      POSTGRES_PASSWORD: spotyfinder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://spotyfinder:spotyfinder@database:5432/spotyfinder
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      CI: "true"
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -lc "pnpm config set store-dir /pnpm/store &&
              pnpm config set network-timeout 600000 &&
              [ -f node_modules/next/dist/bin/next ] || pnpm install --frozen-lockfile --prefer-offline --reporter=append-only &&
              pnpm exec next dev --webpack --hostname 0.0.0.0 --port 3000"

volumes:
  postgres_data:
  frontend_node_modules:
  pnpm_store:
