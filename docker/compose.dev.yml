services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: spotyfinderdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../database/script/ddl.sql:/docker-entrypoint-initdb.d/includes/ddl.inc:ro
      - ../database/script/seed.sql:/docker-entrypoint-initdb.d/includes/seed.inc:ro

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: database
      DB_PORT: "3306"
      DB_NAME: spotyfinderdb
      DB_USER: root
      DB_PASSWORD: ""
    depends_on:
      - database

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      CI: "true"
    depends_on:
      - backend
    command: >
      sh -lc 'pnpm config set store-dir /pnpm/store;
              pnpm config set network-timeout 600000;
              [ -f node_modules/next/dist/bin/next ] || pnpm install --frozen-lockfile --prefer-offline --reporter=append-only;
              pnpm exec next dev --webpack --hostname 0.0.0.0 --port 3000'
volumes:
  mysql_data:
  frontend_node_modules:
  pnpm_store: