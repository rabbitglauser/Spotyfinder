services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spotyfinder_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spotyfinder_test"]
      interval: 5s
      timeout: 5s
      retries: 15

  tests:
    build:
      context: ..
      dockerfile: testing/Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/spotyfinder_test
      PYTHONUNBUFFERED: "1"
      POSTGRES_WAIT_TIMEOUT: "60"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "python testing/scripts/wait_for_postgres.py && pytest --integration -m integration -q",
      ]

